<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs>
  <rect width="900" height="300" fill="#0F172A" rx="16"/>
  <text x="450" y="40" text-anchor="middle" fill="#94A3B8" font-size="16">연쇄 — 만기금은 땅에 닿지 않는다</text>
  <g>
    <rect x="60" y="100" width="200" height="90" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="160" y="138" text-anchor="middle" fill="#F8FAFC" font-size="18" font-weight="700">적금 만기</text>
    <text x="160" y="165" text-anchor="middle" fill="#94A3B8" font-size="13">6개월 · 약 45만 + 이자</text>
  </g>
  <line x1="265" y1="145" x2="335" y2="145" stroke="#94A3B8" stroke-width="3" marker-end="url(#a)"/>
  <g>
    <rect x="350" y="100" width="200" height="90" rx="14" fill="#F59E0B"/>
    <text x="450" y="138" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="700">정기예금</text>
    <text x="450" y="165" text-anchor="middle" fill="#0F172A" font-size="13">생활비 통장 거치지 않음</text>
  </g>
  <line x1="555" y1="145" x2="625" y2="145" stroke="#94A3B8" stroke-width="3" marker-end="url(#a)"/>
  <g>
    <rect x="640" y="100" width="200" height="90" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="740" y="138" text-anchor="middle" fill="#F8FAFC" font-size="18" font-weight="700">같은 요일 재가입</text>
    <text x="740" y="165" text-anchor="middle" fill="#94A3B8" font-size="13">풍차는 멈추지 않는다</text>
  </g>
  <path d="M740,195 L740,240 L160,240 L160,195" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"/>
  <text x="450" y="262" text-anchor="middle" fill="#64748B" font-size="13">6개월마다 반복 · 1년 뒤 예금 약 360만 원</text>
</svg>
